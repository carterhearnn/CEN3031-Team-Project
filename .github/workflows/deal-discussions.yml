name: Deal discussion isolation

on:
  pull_request:
    paths:
      - 'frontend/my-react-app/**'
      - '.github/workflows/deal-discussions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify deal isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/my-react-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/my-react-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:server
      - run: npm run check:isolation
